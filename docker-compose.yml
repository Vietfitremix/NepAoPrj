services:
  postgres:
    image: postgres:16-alpine
    container_name: vietfit-postgres
    environment:
      POSTGRES_DB: viet_fit
      POSTGRES_USER: ${DATABASE_USERNAME:-viet_fit}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    container_name: vietfit-ai
    environment:
      BACKEND_COMPAT_ONLY: "true"
      ENABLE_DEV_ROUTES: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: vietfit-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/viet_fit
      DATABASE_USERNAME: ${DATABASE_USERNAME:-viet_fit}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5176}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
