spring.application.name=viet-fit-backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/viet_fit}
spring.datasource.username=${DATABASE_USERNAME:viet_fit}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.port=${PORT:8080}
app.weather.base-url=${WEATHER_API_URL:https://api.openweathermap.org}
app.weather.api-key=${WEATHER_API_KEY:}
app.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
app.connect-timeout=5s
app.weather-timeout=10s
app.ai-timeout=45s
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5176}
app.web-root=${WEB_ROOT:}
