name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'thang/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Test, Typecheck & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check (TypeScript)
        working-directory: frontend
        run: npm run typecheck

      - name: Run unit & integration tests
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  ai-service:
    name: AI Service (Pytest & Contract Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest test suite
        working-directory: ai-service
        env:
          BACKEND_COMPAT_ONLY: 'true'
          ENABLE_DEV_ROUTES: 'false'
        run: pytest -q

  backend:
    name: Backend (Gradle Test & Build JAR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        working-directory: backend
        run: chmod +x gradlew || true

      - name: Run backend unit tests
        working-directory: backend
        run: ./gradlew test --no-daemon --console=plain

      - name: Build bootJar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon --console=plain -x test

  docker-validate:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest
    needs: [frontend, ai-service, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configurations
        run: |
          docker compose config --quiet
          DATABASE_PASSWORD=test_pw docker compose -f docker-compose.prod.yml config --quiet
