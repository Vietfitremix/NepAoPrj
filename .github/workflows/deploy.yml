name: CD Deploy Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_build:
        description: 'Skip Docker build and deploy existing images'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_name: vietfit-frontend
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image_name: vietfit-backend
          - service: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile
            image_name: vietfit-ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Server (VPS)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || inputs.skip_build == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Deployment Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ] && [ -n "${{ secrets.SSH_USER }}" ] && [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "has_ssh=true" >> $GITHUB_OUTPUT
            echo "SSH credentials detected. Proceeding with automated deployment."
          else
            echo "has_ssh=false" >> $GITHUB_OUTPUT
            echo "Notice: SSH secrets (SSH_HOST, SSH_USER, SSH_PRIVATE_KEY) are not set."
            echo "Automated SSH deployment skipped. Docker images are ready on GHCR."
          fi

      - name: Deploy to VPS via SSH
        if: steps.check_secrets.outputs.has_ssh == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR=${{ secrets.DEPLOY_PATH || '~/vietfit-app' }}
            echo "Deploying VietFit application to $DEPLOY_DIR..."
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            # Log in to GHCR on the target machine
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull latest compose configuration
            curl -sSL -o docker-compose.prod.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.prod.yml

            # Pull newest images
            docker compose -f docker-compose.prod.yml pull

            # Rolling restart
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean stale dangling images
            docker image prune -f

            echo "Deployment to $DEPLOY_DIR succeeded!"
