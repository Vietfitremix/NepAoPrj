       rồi dọc sườn, xẻ tà hai bên từ ngang hông (y~392), tà trước và tà sau dài gần mắt cá; mặc với quần ống rộng.
       Bám số đo nữ: thân rộng hơn mép người 1,5 đến 2; tay áo phủ cánh tay từ vai tới cổ tay. -->
