       #FF0000 = áo ngoài (c-main), #00FF00 = yếm (c-lining), #FF00FF = thắt lưng (c-accent).
       Tham khảo hiện vật Bảo tàng Dân tộc học: áo ngoài mở trước, nẹp viền dọc cổ xuống eo; hai vạt trước
       không may liền mà buộc thắt ở eo, đuôi vạt thả xuống; thân sau (hai vạt may liền) dài gần mắt cá,
       nhìn từ trước thấy ở hai bên; yếm lộ ra ở khoảng giữa hai nẹp; tay áo dài. -->
