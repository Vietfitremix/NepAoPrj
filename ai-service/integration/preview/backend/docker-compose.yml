services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: viet_fit
      POSTGRES_USER: ${DATABASE_USERNAME:-viet_fit}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  ai:
    build: ../ai-service
    environment:
      BACKEND_COMPAT_ONLY: "true"
      ENABLE_DEV_ROUTES: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
    restart: unless-stopped
  backend:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/viet_fit
      DATABASE_USERNAME: ${DATABASE_USERNAME:-viet_fit}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      AI_SERVICE_URL: http://ai:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres-data:
